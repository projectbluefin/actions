name: "bootc-build/sign-and-publish"
description: "Sign image, generate SBOM, attach via ORAS, create GitHub SBOM attestation, and emit SLSA Build L2 provenance (GitHub-hosted runners only)"
author: "projectbluefin"

inputs:
  image:
    description: "Full image reference (e.g. ghcr.io/projectbluefin/bluefin)"
    required: true
  digest:
    description: "Image digest to sign (sha256:...)"
    required: true
  signing-mode:
    description: "Signing mode: 'keyless' (OIDC/Fulcio) or 'key' (COSIGN_PRIVATE_KEY)"
    default: "keyless"
  signing-key:
    description: "Cosign private key (required when signing-mode=key)"
    default: ""
  generate-sbom:
    description: "Generate and attach SBOM with Syft"
    default: "true"
  push-attestation:
    description: "Push GitHub attestation to registry"
    default: "true"
  github-token:
    description: "Token for ORAS login and attestation"
    required: true
  syft-version:
    description: "Syft version to use (default: latest stable)"
    default: "v1.44.0"
  image-name:
    description: "Short image name for SBOM file path (e.g. bluefin)"
    default: ""
  new-bundle-format:
    description: >
      Whether cosign writes signatures in the Sigstore "new bundle format" (OCI 1.1
      referrers) instead of the legacy `sha256-<digest>.sig` tag.

      MUST stay "false" for bootc/podman consumers. containers/image — which backs
      podman, skopeo and `bootc switch` — only discovers signatures via the legacy
      `.sig` tag, so a policy.json `sigstoreSigned` entry cannot see new-format
      signatures. cosign 3.x flipped this default to true, which silently produced
      images that `cosign verify` accepts but podman rejects. See projectbluefin/common#XXX.
    default: "false"
  certificate-identity-regexp:
    description: >
      Regexp for cosign verify --certificate-identity-regexp. Defaults to known signing
      workflows in the projectbluefin org. Callers outside the org must override this with
      their own org prefix (e.g. 'https://github.com/myorg/(myrepo|actions)/').
    default: "https://github.com/projectbluefin/(bluefin|bluefin-lts|dakota|common|aurora|actions)/.github/workflows/"

outputs:
  sbom-digest:
    description: "Digest of the attached SBOM OCI artifact"
    value: ${{ steps.upload-sbom.outputs.sbom-digest }}

runs:
  using: "composite"
  steps:
    - name: Validate keyless permissions
      if: inputs.signing-mode == 'keyless'
      shell: bash
      run: |
        set -euo pipefail
        # id-token:write must be granted by the calling workflow
        # We check indirectly — if ACTIONS_ID_TOKEN_REQUEST_URL is unset, keyless will fail
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "::error::signing-mode=keyless requires 'id-token: write' permission in the calling job."
          exit 1
        fi

    - name: Validate key-based signing input
      if: inputs.signing-mode == 'key'
      shell: bash
      env:
        COSIGN_PRIVATE_KEY: ${{ inputs.signing-key }}
      run: |
        set -euo pipefail
        if [[ -z "${COSIGN_PRIVATE_KEY}" ]]; then
          echo "::error::signing-mode=key requires inputs.signing-key to be set."
          exit 1
        fi

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Fix sigstore cache permissions
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" "${HOME}/.sigstore" 2>/dev/null || true

    - name: Sign container image (keyless)
      if: inputs.signing-mode == 'keyless'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
      env:
        NEW_BUNDLE_FORMAT: ${{ inputs.new-bundle-format }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 30
        command: cosign sign -y --new-bundle-format="${NEW_BUNDLE_FORMAT}" "${IMAGE}@${DIGEST}"

    - name: Sign container image (key-based)
      if: inputs.signing-mode == 'key'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
      env:
        NEW_BUNDLE_FORMAT: ${{ inputs.new-bundle-format }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        COSIGN_PRIVATE_KEY: ${{ inputs.signing-key }}
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 30
        command: cosign sign -y --new-bundle-format="${NEW_BUNDLE_FORMAT}" --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

    - name: Verify signature
      if: inputs.signing-mode == 'keyless'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        CERT_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
      run: |
        set -euo pipefail
        cosign verify \
          --certificate-identity-regexp="${CERT_IDENTITY_REGEXP}" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          "${IMAGE}@${DIGEST}"

    # `cosign verify` succeeds against BOTH the legacy `.sig` tag and the new
    # OCI 1.1 bundle format, so it cannot detect a format regression on its own —
    # that is exactly how cosign 3.x's default flip shipped months of images that
    # verified cleanly but that podman/bootc could not validate.
    # containers/image (podman, skopeo, `bootc switch`) resolves signatures ONLY
    # via `sha256-<digest>.sig`, so assert that tag exists in the registry.
    - name: Assert legacy .sig tag exists (podman/bootc compatibility)
      if: inputs.new-bundle-format == 'false'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail
        sig_tag="${DIGEST/:/-}.sig"
        if ! cosign manifest download "${IMAGE}:${sig_tag}" >/dev/null 2>&1; then
          echo "::error::No legacy signature tag ${IMAGE}:${sig_tag} in the registry."
          echo "::error::cosign verify passed, but containers/image (podman, skopeo, bootc)"
          echo "::error::only discovers signatures via the .sig tag, so this image would be"
          echo "::error::rejected by a policy.json sigstoreSigned entry. Check that"
          echo "::error::--new-bundle-format=false reached the cosign sign invocation."
          exit 1
        fi
        echo "Legacy signature tag present: ${IMAGE}:${sig_tag}"

    - name: Install Syft
      if: inputs.generate-sbom == 'true'
      id: setup-syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        syft-version: ${{ inputs.syft-version }}

    - name: Generate SBOM
      if: inputs.generate-sbom == 'true'
      id: gen-sbom
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        set -euo pipefail
        NAME="${IMAGE_NAME:-$(basename "${IMAGE}")}"
        SBOM_DIR="sbom_out/${NAME}"
        mkdir -p "${SBOM_DIR}"
        "${SYFT_CMD}" "${IMAGE}@${DIGEST}" -o spdx-json="${SBOM_DIR}/sbom.json"
        echo "sbom-path=${SBOM_DIR}/sbom.json" >> "$GITHUB_OUTPUT"
        echo "sbom-dir=${SBOM_DIR}" >> "$GITHUB_OUTPUT"
        echo "image-name=${NAME}" >> "$GITHUB_OUTPUT"

    - name: GitHub SBOM Attestation
      if: inputs.generate-sbom == 'true' && inputs.push-attestation == 'true'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: ${{ steps.gen-sbom.outputs.sbom-path }}
        push-to-registry: true

    - name: Install ORAS
      if: inputs.generate-sbom == 'true'
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

    - name: Login to registry with ORAS
      if: inputs.generate-sbom == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

    - name: Attach SBOM via ORAS
      if: inputs.generate-sbom == 'true'
      id: upload-sbom
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        SBOM_PATH: ${{ steps.gen-sbom.outputs.sbom-path }}
      run: |
        set -euo pipefail
        cd "$(dirname "${SBOM_PATH}")"
        oras attach \
          --artifact-type application/vnd.spdx+json \
          --annotation "filename=$(basename "${SBOM_PATH}")" \
          "${IMAGE}@${DIGEST}" \
          "$(basename "${SBOM_PATH}")"
        SBOM_DIGEST=$(oras discover --format json "${IMAGE}@${DIGEST}" \
          | jq -r '.referrers[] | select(.artifactType == "application/vnd.spdx+json") | .digest' \
          | head -n1)
        if [[ -z "${SBOM_DIGEST}" ]]; then
          echo "::error::Failed to discover attached SBOM digest"
          exit 1
        fi
        echo "sbom-digest=${SBOM_DIGEST}" >> "$GITHUB_OUTPUT"

    - name: Sign SBOM artifact
      if: inputs.generate-sbom == 'true' && inputs.signing-mode == 'keyless'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
      env:
        NEW_BUNDLE_FORMAT: ${{ inputs.new-bundle-format }}
        IMAGE: ${{ inputs.image }}
        SBOM_DIGEST: ${{ steps.upload-sbom.outputs.sbom-digest }}
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 30
        command: cosign sign -y --new-bundle-format="${NEW_BUNDLE_FORMAT}" "${IMAGE}@${SBOM_DIGEST}"

    - name: Sign SBOM artifact (key-based)
      if: inputs.generate-sbom == 'true' && inputs.signing-mode == 'key'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
      env:
        NEW_BUNDLE_FORMAT: ${{ inputs.new-bundle-format }}
        IMAGE: ${{ inputs.image }}
        SBOM_DIGEST: ${{ steps.upload-sbom.outputs.sbom-digest }}
        COSIGN_PRIVATE_KEY: ${{ inputs.signing-key }}
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 30
        command: cosign sign -y --new-bundle-format="${NEW_BUNDLE_FORMAT}" --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${SBOM_DIGEST}"

    - name: GitHub Build Provenance Attestation
      if: inputs.push-attestation == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true
