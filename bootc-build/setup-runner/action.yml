name: "bootc-build/setup-runner"
description: "Prepare a GitHub Actions runner for bootc image building"
author: "projectbluefin"

inputs:
  storage-backend:
    description: "Storage backend: 'btrfs' (remove-software + BTRFS loopback for /var/lib/containers) or 'remove-software' (remove-software only)"
    default: "btrfs"
  update-podman:
    description: "Upgrade podman/buildah/crun/skopeo from Ubuntu resolute (26.04) on runner images that ship an older stack; no-op on ubuntu-26.04 runners"
    default: "true"
  apt-packages:
    description: "Space-separated Ubuntu package names to install from the runner's own sources with a weekly cache"
    default: ""
  native-overlay:
    description: "Use native rootful overlay storage instead of fuse-overlayfs; resets rootful Podman storage"
    default: "false"
  install-tools:
    description: "JSON array of tools to install: e.g. '[\"just\", \"cosign\", \"oras\", \"syft\"]'"
    default: "[]"

outputs:
  podman-version:
    description: "Installed podman version string"
    value: ${{ steps.podman-version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Validate native overlay inputs
      shell: bash
      env:
        NATIVE_OVERLAY: ${{ inputs.native-overlay }}
      run: |
        set -euo pipefail
        case "${NATIVE_OVERLAY}" in
          true|false) ;;
          *)
            echo "::error::native-overlay must be 'true' or 'false'."
            exit 1
            ;;
        esac

    - name: Maximize build space (remove-software)
      if: inputs.storage-backend == 'btrfs' || inputs.storage-backend == 'remove-software'
      uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master
      with:
        extra-squeeze: "true"

    - name: Mount BTRFS for podman storage
      if: inputs.storage-backend == 'btrfs'
      uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # no-release, Merge PR #18 (2026-02)
      with:
        target-dir: /var/lib/containers
        mount-opts: compress-force=zstd:2
        loopback-free: "1"

    # Install native packages before adding resolute: never mix Ubuntu sources
    # or cache entries between the optional tools and the Podman upgrade.
    - name: Compute native apt cache key
      if: inputs.apt-packages != ''
      id: apt-pkgs-key
      shell: bash
      env:
        APT_MODE: native
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: bash "$GITHUB_ACTION_PATH/apt-cache.sh" key

    - name: Restore native apt package cache
      if: inputs.apt-packages != ''
      id: apt-pkgs-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-native-cache
        key: ${{ steps.apt-pkgs-key.outputs.key }}

    - name: Install native Ubuntu packages
      if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_MODE: native
        APT_PACKAGES: ${{ inputs.apt-packages }}
        APT_CACHE_DIR: ${{ runner.temp }}/apt-native-cache
        APT_CACHE_HIT: ${{ steps.apt-pkgs-restore.outputs.cache-hit }}
      run: bash "$GITHUB_ACTION_PATH/apt-cache.sh" install

    - name: Save native apt package cache
      if: inputs.apt-packages != '' && steps.apt-pkgs-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-native-cache
        key: ${{ steps.apt-pkgs-key.outputs.key }}

    - name: Select podman source
      if: inputs.update-podman == 'true'
      id: podman-source
      shell: bash
      run: |
        set -euo pipefail
        IDV=$(. /usr/lib/os-release && echo "${ID}-${VERSION_ID}")
        case "${IDV}" in
          ubuntu-24.04)
            # Ubuntu 24.04's podman (4.9.x) does not push layer annotations
            # (ostree.components) needed by the rpm-ostree rechunker and does not
            # support zstd:chunked push. The resolute (26.04) packages install on
            # noble, so pull the whole stack from there.
            if [ "$(dpkg --print-architecture)" = "amd64" ]; then
              mirror="http://azure.archive.ubuntu.com/ubuntu"
            else
              mirror="http://ports.ubuntu.com/ubuntu-ports"
            fi
            echo "deb ${mirror} resolute universe main" | sudo tee /etc/apt/sources.list.d/resolute.list
            echo "install-from-resolute=true" >> "$GITHUB_OUTPUT"
            ;;
          ubuntu-26.04)
            # resolute *is* 26.04: verify the runner's podman is 5.x or newer
            PODMAN_VERSION=$(podman --version 2>/dev/null | awk '{print $3}' || echo "unknown")
            if [[ ! "${PODMAN_VERSION}" =~ ^([0-9]+)\. ]] || (( BASH_REMATCH[1] < 5 )); then
              echo "::error::ubuntu-26.04 runner image has podman '${PODMAN_VERSION}', but version 5.x or newer is required for layer annotations and zstd:chunked push."
              exit 1
            fi
            echo "::notice::${IDV} ships podman ${PODMAN_VERSION}; skipping the resolute apt source."
            echo "install-from-resolute=false" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::setup-runner supports ubuntu-24.04 and ubuntu-26.04 runner images; found '${IDV}'. Set update-podman: 'false' to skip the podman upgrade."
            exit 1
            ;;
        esac

    - name: Compute apt cache key (weekly rotation)
      if: steps.podman-source.outputs.install-from-resolute == 'true'
      id: apt-cache-key
      shell: bash
      env:
        APT_MODE: resolute
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: bash "$GITHUB_ACTION_PATH/apt-cache.sh" key

    - name: Restore apt package cache
      if: steps.podman-source.outputs.install-from-resolute == 'true'
      id: apt-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-resolute-cache
        key: ${{ steps.apt-cache-key.outputs.key }}

    - name: Install podman stack from Ubuntu resolute
      if: steps.podman-source.outputs.install-from-resolute == 'true'
      shell: bash
      env:
        APT_MODE: resolute
        APT_PACKAGES: ${{ inputs.apt-packages }}
        APT_CACHE_DIR: ${{ runner.temp }}/apt-resolute-cache
        APT_CACHE_HIT: ${{ steps.apt-cache-restore.outputs.cache-hit }}
      run: bash "$GITHUB_ACTION_PATH/apt-cache.sh" install

    - name: Save apt package cache
      if: steps.podman-source.outputs.install-from-resolute == 'true' && steps.apt-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-resolute-cache
        key: ${{ steps.apt-cache-key.outputs.key }}

    - name: Configure native rootful overlay storage
      if: inputs.native-overlay == 'true'
      shell: bash
      run: |
        set -euo pipefail

        # GitHub runners' sudo preserves XDG_RUNTIME_DIR, so a plain
        # `sudo podman` drops root-owned state (crun, libpod) into the
        # runner user's runtime dir and breaks every later rootless podman
        # call with EACCES. Scrub the variable from all rootful calls.
        sudo_podman() {
          sudo env -u XDG_RUNTIME_DIR podman "$@"
        }

        PODMAN_VERSION=$(sudo_podman --version 2>/dev/null | awk '{print $3}')
        if [[ ! "${PODMAN_VERSION}" =~ ^([0-9]+)\. ]] || (( BASH_REMATCH[1] < 5 )); then
          echo "::error::native-overlay requires the runner's Podman 5.x or newer; found '${PODMAN_VERSION:-unknown}'."
          exit 1
        fi

        # Reset while the old configuration is still active. containers/storage
        # records mount-program use in overlay/.has-mount-program, so editing the
        # configuration alone can leave fuse-overlayfs selected.
        sudo_podman system reset --force

        sudo install -d -m 0755 /etc/containers
        sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
        [storage]
        driver = "overlay"
        runroot = "/run/containers/storage"
        graphroot = "/var/lib/containers/storage"

        [storage.options.overlay]
        mountopt = "nodev"
        EOF

        # podman system reset removes graphroot; remove the marker explicitly as
        # a fail-safe for runner-image implementations that preserve the path.
        sudo rm -f /var/lib/containers/storage/overlay/.has-mount-program

        INFO=$(sudo_podman info --format json)

        # Fail-safe: sweep root-owned leftovers out of the user runtime dir
        # in case a rootful call still created state there.
        if [[ -n "${XDG_RUNTIME_DIR:-}" ]]; then
          sudo find "${XDG_RUNTIME_DIR}" -mindepth 1 -maxdepth 1 -user root -exec rm -rf {} +
        fi
        DRIVER=$(jq -r '.store.graphDriverName // empty' <<<"${INFO}")
        NATIVE_DIFF=$(jq -r '.store.graphStatus["Native Overlay Diff"] // empty' <<<"${INFO}")
        GRAPH_OPTIONS=$(jq -c '.store.graphOptions // {}' <<<"${INFO}")

        if [[ "${DRIVER}" != "overlay" ]]; then
          echo "::error::Expected rootful Podman storage driver 'overlay', found '${DRIVER:-unknown}'."
          exit 1
        fi
        if [[ "${GRAPH_OPTIONS}" == *mount_program* ]]; then
          echo "::error::Rootful Podman still reports a mount_program: ${GRAPH_OPTIONS}"
          exit 1
        fi
        # "Native Overlay Diff" is diagnostic only: containers/storage
        # refuses the native diff fast path whenever the kernel's overlay
        # module has redirect_dir enabled (the Ubuntu default) and computes
        # layer diffs naively instead. Layer mounts still use kernel
        # overlayfs (no FUSE), which is what this mode guarantees, so
        # report the status without failing.
        if [[ "${NATIVE_DIFF}" != "true" ]]; then
          echo "::notice::Rootful Podman computes overlay diffs naively (native diff: '${NATIVE_DIFF:-unknown}'); expected on Ubuntu kernels with CONFIG_OVERLAY_FS_REDIRECT_DIR=y."
        fi

        echo "Podman ${PODMAN_VERSION}: driver=${DRIVER}, native-diff=${NATIVE_DIFF}, graph-options=${GRAPH_OPTIONS}"

    - name: Install just
      if: contains(fromJSON(inputs.install-tools), 'just')
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: just

    - name: Install cosign
      if: contains(fromJSON(inputs.install-tools), 'cosign')
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Install ORAS
      if: contains(fromJSON(inputs.install-tools), 'oras')
      uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

    - name: Install Syft
      if: contains(fromJSON(inputs.install-tools), 'syft')
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        syft-version: v1.44.0

    - name: Get podman version
      id: podman-version
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(podman --version 2>/dev/null | awk '{print $3}' || echo "unknown")
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
