name: "Install cosign"
description: "Install cosign from a GitHub release asset with cache and source-build fallback"
author: "projectbluefin"

inputs:
  cosign-release:
    description: "Cosign release to install (for example v3.0.6)"
    required: false
    default: "v3.0.6"
  install-dir:
    description: "Directory to install the cosign binary into"
    required: false
    default: ""
  use-sudo:
    description: "Use sudo when installing the binary"
    required: false
    default: "false"
  expected-sha256:
    description: "SHA-256 of the release asset. Required when cosign-release is not a pinned known release."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Prepare cosign install
      id: prepare
      shell: bash
      run: |
        set -euo pipefail
        release="${{ inputs.cosign-release }}"
        install_dir="${{ inputs.install-dir }}"
        if [ -z "${install_dir}" ]; then
          install_dir="${HOME}/.cosign"
        fi
        mkdir -p "${install_dir}"
        echo "release=${release}" >> "$GITHUB_OUTPUT"
        echo "install-dir=${install_dir}" >> "$GITHUB_OUTPUT"
        echo "${install_dir}" >> "$GITHUB_PATH"

    - name: Restore cosign from cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prepare.outputs.install-dir }}
        key: cosign-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.release }}
        # No restore-keys: a prefix match could restore a binary from a
        # different cosign release than the one requested.

    - name: Install cosign
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        COSIGN_RELEASE: ${{ steps.prepare.outputs.release }}
        INSTALL_DIR: ${{ steps.prepare.outputs.install-dir }}
        USE_SUDO: ${{ inputs.use-sudo }}
        EXPECTED_SHA256: ${{ inputs.expected-sha256 }}
      run: |
        set -euo pipefail
        binary="${INSTALL_DIR}/cosign"
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m)"

        case "${arch}" in
          x86_64) arch="amd64" ;;
          aarch64|arm64) arch="arm64" ;;
          armv7l) arch="arm" ;;
        esac

        case "${os}" in
          linux) ;;
          darwin) ;;
          *)
            echo "Unsupported OS: ${os}" >&2
            exit 1
            ;;
        esac

        # Pinned SHA-256 for known releases (from cosign_checksums.txt in the
        # upstream release). Any other release requires expected-sha256 input.
        if [ -z "${EXPECTED_SHA256}" ]; then
          case "${COSIGN_RELEASE}:${os}:${arch}" in
            v3.0.6:linux:amd64)  EXPECTED_SHA256="c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74" ;;
            v3.0.6:linux:arm64)  EXPECTED_SHA256="bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8" ;;
            v3.0.6:darwin:amd64) EXPECTED_SHA256="4c3e7af8372d3ca3296e62fa56f23fcbb5721cc6ac1827900d398f110d7cd280" ;;
            v3.0.6:darwin:arm64) EXPECTED_SHA256="5fadd012ae6381a6a29ff86a7d39aa873878852f1073fc90b15995961ecfb084" ;;
          esac
        fi

        asset_url="https://github.com/sigstore/cosign/releases/download/${COSIGN_RELEASE}/cosign-${os}-${arch}"
        tmp_dir="$(mktemp -d)"
        tmp_file="${tmp_dir}/cosign"

        for attempt in 1 2 3 4 5; do
          if curl --fail --location --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 "${asset_url}" -o "${tmp_file}"; then
            break
          fi
          echo "Cosign download attempt ${attempt}/5 failed; retrying..." >&2
          rm -f "${tmp_file}"
          sleep $((attempt * 5))
        done

        if [ -s "${tmp_file}" ]; then
          if [ -z "${EXPECTED_SHA256}" ]; then
            echo "No pinned SHA-256 for ${COSIGN_RELEASE} ${os}/${arch} and no expected-sha256 input given." >&2
            echo "Refusing to install an unverified cosign binary." >&2
            exit 1
          fi
          actual_sha256="$(sha256sum "${tmp_file}" | awk '{print $1}')"
          if [ "${actual_sha256}" != "${EXPECTED_SHA256}" ]; then
            echo "SHA-256 mismatch for cosign-${os}-${arch} (${COSIGN_RELEASE}):" >&2
            echo "  expected: ${EXPECTED_SHA256}" >&2
            echo "  actual:   ${actual_sha256}" >&2
            exit 1
          fi
          echo "SHA-256 verified: ${actual_sha256}"
          install_cmd=(install)
          if [ "${USE_SUDO}" = "true" ]; then
            install_cmd=(sudo install)
          fi
          "${install_cmd[@]}" -m 0755 "${tmp_file}" "${binary}"
        else
          echo "Cosign release asset download failed; falling back to a source build..." >&2
          if ! command -v go >/dev/null 2>&1; then
            echo "go is required for the cosign fallback build" >&2
            exit 1
          fi
          GOBIN="${INSTALL_DIR}" GO111MODULE=on go install "github.com/sigstore/cosign/v3/cmd/cosign@${COSIGN_RELEASE}"
          if [ ! -x "${binary}" ]; then
            echo "Cosign fallback install did not produce ${binary}" >&2
            exit 1
          fi
        fi

        rm -rf "${tmp_dir}"
        "${binary}" version

    - name: Verify cosign installation
      shell: bash
      run: |
        set -euo pipefail
        cosign version
