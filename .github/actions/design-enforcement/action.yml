name: Design enforcement
description: Enforce the projectbluefin seven-label issue and review workflow.
author: projectbluefin
inputs:
  hive_contribute_url:
    description: URL shown in the Clanker queue announcement.
    required: false
    default: https://kubestellar.io/live/hive/bluefin/
  required_field_groups:
    description: JSON array of alternative issue-template headings required for opt-in.
    required: false
    default: '[["What happened?","What would you like to see?"],["Steps to reproduce","What does done look like?"],["Affected area"]]'
runs:
  using: node20
  main: index.js
