name: Bluefin Server installer test

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Artifact containing the exported installer and PXE boot inputs"
        type: string
        required: false
        default: server-installer-test

permissions: {}

jobs:
  test:
    name: Install and boot in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: taiki-e/install-action@844d13d3ed6991e61a4ebc2c067073e3ed4f5ee1 # just
        with:
          tool: just

      - name: Download installer test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Install QEMU runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            curl \
            jq \
            ovmf \
            qemu-system-x86 \
            zstd

      - name: Enable KVM access
        run: |
          set -euo pipefail
          test -e /dev/kvm || {
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          }
          sudo chown "$USER" /dev/kvm
          sudo chmod u+rw /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Install and boot exported server image
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/qemu-evidence
          SHOW_ME_THE_FUTURE_DEADLINE: "900"
          SHOW_ME_THE_FUTURE_MEM: "8192"
          SHOW_ME_THE_FUTURE_SMP: "4"
        run: just test-installer-artifact

      - name: Upload QEMU failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-installer-qemu-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: qemu-evidence/bluefin-show-future.*/serial.log
