name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/actionlint.yml"
      - ".github/workflows/reusable-design-enforcement.yml"
      - "actions/**"
      - "bootc-build/**"
      - "issue-lifecycle/**"
      - "prow-labels/**"
      - ".github/workflows/reusable-issue-lifecycle.yml"
      - ".github/workflows/reusable-issue-policy-preview.yml"
      - "scripts/**"
      - ".github/actions/**"
      - "tests/**"
      - ".github/workflows/factory-drift.yml"
      - ".github/workflows/factory-health.yml"
      - ".github/workflows/ghcr-cleanup.yml"
      - ".github/workflows/factory-health.yml"
      - ".github/workflows/reusable-build.yml"
      - ".github/workflows/reusable-execute-release.yml"
      - ".github/workflows/reusable-pkg-cadence.yml"
      - ".github/workflows/reusable-promote-squash.yml"
      - ".github/workflows/reusable-release-gate.yml"
      - ".github/workflows/reusable-release.yml"
      - ".github/workflows/reusable-renovate-automerge.yml"
      - ".github/workflows/reusable-renovate.yml"
      - ".github/workflows/reusable-thin-caller-gate.yml"
      - ".github/workflows/unit-tests.yml"

permissions: {}

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/bats \
            --cov=bootc-build/chunka \
            --cov=bootc-build/create-release/scripts \
            --cov=scripts \
            --cov=.github/actions/render-pr-body \
            --cov=.github/actions/render-gate-section \
            --cov-report=term-missing \
            --cov-fail-under=75

  node:
    name: node
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Node tests
        run: node --test tests/node/*.test.mjs

  bats:
    name: bats
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: |
          sudo npm install -g bats@1.13.0
          bats --version

      - name: Run bats tests
        run: bats --print-output-on-failure tests/bats/
