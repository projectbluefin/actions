name: Unit Tests

on:
  push:
    branches: [main]
  # Every pull request and the merge queue, so bats, node and pytest can be
  # required checks: a path filter would leave a required check missing.
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: pip install --require-hashes -r tests/requirements-test.txt

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/bats \
            --cov=bootc-build/chunka \
            --cov=bootc-build/create-release/scripts \
            --cov=scripts \
            --cov=.github/actions/render-pr-body \
            --cov=.github/actions/render-gate-section \
            --cov-report=term-missing \
            --cov-fail-under=75

  node:
    name: node
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Node tests
        run: node --test tests/node/*.test.mjs

  bats:
    name: bats
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        working-directory: .github/tools/bats
        run: |
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          ./node_modules/.bin/bats --version

      - name: Run bats tests
        run: bats --print-output-on-failure tests/bats/
