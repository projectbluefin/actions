name: bootc Upgrade and Rollback Test
# Reusable workflow: post-build gate that boots the newly pushed image in QEMU
# and runs the projectbluefin/testsuite lifecycle suite (upgrade + rollback).
#
# Wire it after your build job and gate promotion on the result:
#
#   upgrade-test:
#     needs: build
#     uses: projectbluefin/actions/.github/workflows/upgrade-test.yml@<pinned-ref>
#     with:
#       image: ghcr.io/your-org/your-image@${{ needs.build.outputs.digest }}
#
#   promote:
#     needs: upgrade-test
#     if: needs.upgrade-test.outputs.result == 'success'
#
# The lifecycle suite validates: bootc status, upgrade, reboot into new
# deployment, rollback to previous deployment, and /etc persistence.
# See: https://github.com/projectbluefin/testsuite/blob/main/tests/lifecycle/features/bootc.feature
#
# Pass `previous_image` (a digest-pinned earlier build of the same image) to
# test a real upgrade: the VM boots `previous_image`, stages `image` as the
# target, upgrades, reboots and rolls back. Without it the lifecycle suite
# boots `image` and "upgrades" to itself, which testsuite's no-op guard
# (projectbluefin/testsuite#1039, #1047) correctly fails. See #753.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full OCI image reference (e.g. ghcr.io/ublue-os/bluefin:latest)"
        required: true
        default: "ghcr.io/ublue-os/bluefin:latest"
      suites:
        description: "Comma-separated suites (default: lifecycle)"
        required: false
        default: "lifecycle"
      chunked_enabled:
        description: "Enable zstd:chunked migration scenarios"
        required: false
        default: "false"
      previous_image:
        description: "Digest-pinned earlier build of the same image to boot first and upgrade from (empty: upgrade-to-self, which fails as a no-op)"
        required: false
        default: ""
  workflow_call:
    inputs:
      image:
        description: >
          Full OCI image reference to boot and gate on — accepts a tag or pinned digest.
          Pass the freshly built digest from your build job to gate promotion on it.
          Example (digest gate): ghcr.io/ublue-os/bluefin@sha256:abc123
          Example (tag gate):    ghcr.io/ublue-os/bluefin:stable
          Example (LTS):         ghcr.io/ublue-os/bluefin-lts:lts
        required: true
        type: string
      suites:
        description: >
          Comma-separated test suites to run.
          Default is 'lifecycle' which covers: bootc status, upgrade, rollback,
          /etc merge, and idempotency.
          Any suite supported by projectbluefin/testsuite may be added.
        type: string
        default: "lifecycle"
      skip_native_apps:
        description: "Skip @native_app scenarios (non-Flatpak app tests)"
        type: boolean
        default: false
      screenshot_flatpaks:
        description: >
          Comma-separated Flatpak app IDs to launch-and-screenshot after the
          test run. Leave empty to skip.
        type: string
        default: ""
      chunked_enabled:
        description: "Enable zstd:chunked migration scenarios in the lifecycle suite"
        type: boolean
        default: false
      previous_image:
        description: >
          Digest-pinned (@sha256:) earlier build of the same image repository
          to boot first; `image` is then staged and upgraded to. Images with
          dated immutable tags can resolve the previous build from them (e.g.
          the newest `testing-YYYYMMDD-<sha>` older than the candidate, by
          digest). Empty keeps today's behaviour: the VM boots `image` and
          upgrades to itself, which the lifecycle suite fails as a no-op.
        type: string
        default: ""

    outputs:
      result:
        description: "Outcome of the upgrade test job: success, failure, cancelled, or skipped"
        value: ${{ jobs.report.outputs.result }}

permissions: {}

jobs:
  plan:
    name: Check upgrade source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      boot_image: ${{ steps.plan.outputs.boot_image }}
      target_image: ${{ steps.plan.outputs.target_image }}
    steps:
      - id: plan
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          PREVIOUS_IMAGE: ${{ inputs.previous_image }}
        run: |
          set -euo pipefail
          # Repository part of a ref: drop @digest, then a :tag after the last /.
          repo_of() {
            local ref=${1%%@*}
            [[ "${ref##*/}" == *:* ]] && ref=${ref%:*}
            printf '%s' "$ref"
          }
          if [[ -z "${PREVIOUS_IMAGE}" ]]; then
            echo "boot_image=${IMAGE}" >> "$GITHUB_OUTPUT"
            echo "target_image=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${PREVIOUS_IMAGE}" != *@sha256:* ]]; then
            echo "::error::previous_image must be digest-pinned (…@sha256:…): ${PREVIOUS_IMAGE}"; exit 1
          fi
          if [[ "${PREVIOUS_IMAGE}" == "${IMAGE}" ]]; then
            echo "::error::previous_image equals image; an upgrade to itself is a no-op"; exit 1
          fi
          if [[ "$(repo_of "${PREVIOUS_IMAGE}")" != "$(repo_of "${IMAGE}")" ]]; then
            echo "::error::previous_image must be from the same repository as image ($(repo_of "${IMAGE}"))"; exit 1
          fi
          echo "boot_image=${PREVIOUS_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "target_image=${IMAGE}" >> "$GITHUB_OUTPUT"

  upgrade-test:
    name: Upgrade & rollback — ${{ inputs.image }}
    needs: plan
    # Keep this pin identical to the testsuite e2e.yml pin in reusable-execute-release.yml
    # (same `# v1` comment) so Renovate bumps all callers together.
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@87bdbafbc7de4d83744682144a4ea3494735d0b6 # v1
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ needs.plan.outputs.boot_image }}
      target-image: ${{ needs.plan.outputs.target_image }}
      suites: ${{ inputs.suites || 'lifecycle' }}
      skip_native_apps: ${{ inputs.skip_native_apps || false }}
      screenshot_flatpaks: ${{ inputs.screenshot_flatpaks || '' }}
      chunked_enabled: ${{ inputs.chunked_enabled == true || inputs.chunked_enabled == 'true' }}

  report:
    needs: upgrade-test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      result: ${{ needs.upgrade-test.result }}
    steps:
      - run: echo "upgrade-test result=${{ needs.upgrade-test.result }}"
