name: actionlint

on:
  # No `paths:` filter on pull_request. `Lint GitHub Actions` is the sole
  # required status check on main, and a required check that never reports
  # leaves the PR permanently BLOCKED. reviewdog scopes annotations to the
  # diff, so a PR touching no workflow files reports success with nothing
  # to say. See docs/skills/testing.md -> "Required checks must be reachable".
  pull_request:
    branches: [main]
  # merge_group is required for the same reason: the ALLGREEN merge queue
  # waits for the required check on the merge-group ref, and no workflow
  # listened for this event.
  merge_group:
  push:
    branches: [main]

permissions: {}

jobs:
  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write  # reviewdog github-pr-check / github-check reporter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up trusted policy-data parser
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install workflow parser
        run: python3 -m pip install 'pyyaml==6.0.3'

      - name: Check self-repository references
        run: python3 scripts/check-self-repository-references.py

      - name: Run actionlint
        uses: reviewdog/action-actionlint@cfa6a621f27735ccc88d35af9d0608692fd9b9f7 # v1.80.8
        with:
          # Push and merge_group have no PR context; both produce native check evidence.
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}
          fail_on_error: true
          # https://github.blog/changelog/2023-02-09-github-actions-update-on-code-and-workflow-permissions/
