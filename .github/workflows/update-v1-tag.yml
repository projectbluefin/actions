# Publish managed v1 only after both native main CI workflows succeed.
# workflow_run reads trusted main source only; no PR code or artifacts execute.

name: Update v1 tag

on:
  workflow_run:
    workflows: [Unit Tests, actionlint]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: update-v1-tag
  cancel-in-progress: true

jobs:
  update-tag:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      actions: read
    name: Force-push v1 to HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: main

      - name: Require actual main CI before publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha=$(git rev-parse HEAD)
          if [[ "$current_sha" != "$CI_SHA" ]]; then
            echo 'Completed CI is not for current main; leaving v1 unchanged.'
            exit 1
          fi
          for workflow in unit-tests.yml actionlint.yml; do
            result=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?head_sha=$CI_SHA&branch=main&event=push&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$CI_SHA"'" and .head_branch == "main")] | sort_by(.id) | last | .conclusion')
            if [[ "$result" != success ]]; then
              printf 'Main CI %s is not successful; leaving v1 unchanged.\n' "$workflow"
              exit 1
            fi
          done

      - name: Update v1 tag
        run: |
          set -euo pipefail

          CURRENT_SHA=$(git rev-parse HEAD)

          # Check if v1 already points to HEAD
          EXISTING_TAG_SHA=$(git ls-remote --tags origin refs/tags/v1 | awk '{print $1}')

          if [ "$EXISTING_TAG_SHA" = "$CURRENT_SHA" ]; then
            echo "v1 already points to HEAD (${CURRENT_SHA::7}) — nothing to do"
            exit 0
          fi

          git tag -f v1 HEAD
          git push --force origin v1

          echo "Updated v1: ${EXISTING_TAG_SHA::7} → ${CURRENT_SHA::7}"
