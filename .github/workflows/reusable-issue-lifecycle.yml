name: Repository issue lifecycle

on:
  workflow_call:
    # requires: any
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply only reviewed default-branch policy; false reads only
      issue:
        type: string
        default: ''
        description: Optional issue or PR number; empty uses the event or repository sweep
      labels-only:
        type: boolean
        default: false
        description: Quiet label repair without comments, mentions, or closure
      migrate:
        type: boolean
        default: false
        description: Quiet full-history alias and retired-label migration
      retire:
        type: boolean
        default: false
        description: Retire obsolete definitions only after assignments are migrated
      confirm-client-cutover:
        type: boolean
        default: false
        description: Confirm supported callers no longer write retired labels

permissions: {}

concurrency:
  group: ${{ github.repository }}-issue-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default-branch catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Apply authorized Prow command and explain the observed result
        if: inputs.apply && github.event_name == 'issue_comment'
        uses: $/prow-labels
        with:
          github-token: ${{ github.token }}
          catalog: ${{ github.workspace }}/.github/issue-policy.json
      - name: Reconcile lifecycle and role-directed next actions
        id: policy
        if: ${{ always() && !cancelled() }}
        uses: $/issue-lifecycle
        with:
          apply: ${{ inputs.apply }}
          issue: ${{ inputs.issue }}
          event-file: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.event_path || '' }}
          labels-only: ${{ inputs['labels-only'] || inputs.migrate }}
          migrate: ${{ inputs.migrate }}
          retire-labels: ${{ inputs.retire }}
          confirm-client-cutover: ${{ inputs['confirm-client-cutover'] }}
          output: ${{ runner.temp }}/issue-lifecycle-preview.json
      - name: Preserve preview and migration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-lifecycle-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.policy.outputs.backup-directory }}
            ${{ runner.temp }}/issue-lifecycle-preview.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
