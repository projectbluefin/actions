# Scheduled wiring assertion for the Renovate/MergeRaptor auto-merge path
# (projectbluefin/actions#403, projectbluefin/actions#514).
#
# The end-to-end merge needs a real mergeraptor PR with autoMergeRequest !=
# null, created out-of-band by Renovate and impossible to force from CI. But the
# facts that make such a PR mergeable are declarative and can be asserted here:
# the repo allows auto-merge, and the MergeRaptor app is the sole review-bypass
# actor on main (so the minted app token can actually bypass the required review).
# When a qualifying PR lands, this check passing is the precondition evidence
# that the merge step in renovate-automerge.yml can run.
#
# `repos/{owner}/{repo}.allow_auto_merge` and a branch ruleset's `bypass_actors`
# are only returned by the API to a caller with push/administration access to
# the repo (GitHub silently omits the field otherwise — it does not report
# `false`/`[]`). The default `github.token` on a schedule/workflow_dispatch run
# has no such access regardless of the `permissions:` block below, so this job
# mints a MergeRaptor app token instead. Note: being a branch-ruleset bypass
# actor is a ruleset setting, not an app installation permission — it does not
# by itself grant this token Administration:read.
#
# If the MergeRaptor GitHub App installation lacks Administration:read, this
# job fails at the "Generate app token" step, not in the script: the step below
# asks for `permission-administration: read`, and GitHub's installation-token
# endpoint rejects a request for a permission the installation does not hold
# with a 422 rather than minting a downscoped token. Either way the failure is
# loud and names the real cause — the script's "... is unreadable" branches
# (renovate-automerge-wiring-check.sh) remain the guard for any other token
# that reaches it without push/administration access, so a permission gap can
# never surface as a false "setting is disabled" negative. This is still safe
# to ship without first confirming the installation's permission set; it just
# reports that case at mint time. See projectbluefin/actions#514.

name: Renovate Auto-merge Wiring Check

on:
  schedule:
    - cron: '0 7 * * *' # daily, after the overnight Renovate run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiring-check:
    name: Verify auto-merge wiring
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          # client-id accepts either the numeric App ID or the client ID; this
          # is the same MERGERAPTOR_APP_ID secret reusable-renovate-automerge.yml
          # passes as app-id (create-github-app-token treats both inputs as
          # equivalent JWT issuer identifiers) — not a wrong-secret mismatch.
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          owner: projectbluefin
          repositories: actions
          # Downscope below the installation's full permission set: this job
          # only reads repo/ruleset settings and lists PRs, it never needs the
          # contents:write that lets MergeRaptor merge past required review.
          permission-administration: read
          permission-metadata: read
          permission-pull-requests: read

      - name: Verify auto-merge wiring
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: projectbluefin
          REPO: actions
        run: scripts/renovate-automerge-wiring-check.sh
