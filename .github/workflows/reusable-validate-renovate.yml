name: reusable-validate-renovate
# Validates a renovate.json5 config file in the caller's repository.
# Callers: actions, bluefin, bluefin-lts, dakota

on:
  workflow_call:
    # requires: any

permissions: {}

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Renovate's official image, pinned to its multi-arch index digest, carries
      # the validator and its whole dependency tree. An `npm install -g` here
      # would resolve hundreds of transitive packages unverified on every run.
      - name: Validate Renovate config
        uses: docker://ghcr.io/renovatebot/renovate:44.14.12@sha256:160125831b82ae05c734870b9f65094e0f8699a0e44f3274bacc7b36a9041047
        with:
          args: renovate-config-validator --strict
