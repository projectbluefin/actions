# Merges source_branch into target_branch after a squash-merge promotion.
# Prevents the recurring "BEHIND" state caused by squash merges creating a
# divergence between the source branch and its squash commit on the target.
# Called by each consumer repo's sync-main-to-testing.yml on push to main.
#
# Divergence handling: if target has commits source does not (e.g. Renovate
# PRs landed on testing while main got CI fixes), the target is force-reset
# to source instead of attempting a merge. The force-reset is safe because:
#   - Automated commits on testing (Renovate digests) are recreated by Renovate
#   - Human commits should not land on testing directly (enforced by pr-triage)
#   - A failed merge leaves the pipeline broken indefinitely; force-reset
#     recovers in seconds and is logged clearly.
name: Reusable Sync Branches

on:
  workflow_call:
    # requires: App-token|any
    inputs:
      source_branch:
        description: "Branch to merge from (e.g. main)"
        default: main
        type: string
      target_branch:
        description: "Branch to merge into (e.g. testing)"
        default: testing
        type: string
    secrets:
      GH_TOKEN:
        description: "GitHub App token for bypassing protected-branch push rules. Generate in caller using actions/create-github-app-token and pass here."
        required: false

permissions: {}

jobs:
  sync:
    name: Merge ${{ inputs.source_branch }} → ${{ inputs.target_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if sync is needed
        id: check
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${SOURCE_BRANCH}" "${TARGET_BRANCH}"
          SOURCE_TREE=$(git rev-parse "origin/${SOURCE_BRANCH}^{tree}")
          TARGET_TREE=$(git rev-parse "origin/${TARGET_BRANCH}^{tree}")
          if [ "$SOURCE_TREE" = "$TARGET_TREE" ]; then
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
            echo "Branches have identical trees — no sync needed"
          else
            echo "sync_needed=true" >> "$GITHUB_OUTPUT"
            echo "Trees differ — syncing ${SOURCE_BRANCH} into ${TARGET_BRANCH}"
          fi

      - name: Detect divergence
        id: diverge
        if: steps.check.outputs.sync_needed == 'true'
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          AHEAD=$(git rev-list --count \
            "origin/${SOURCE_BRANCH}..origin/${TARGET_BRANCH}")
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -gt 0 ]; then
            echo "strategy=force-reset" >> "$GITHUB_OUTPUT"
            echo "⚠️  ${TARGET_BRANCH} is ${AHEAD} commit(s) ahead of ${SOURCE_BRANCH} — diverged, will force-reset"
          else
            echo "strategy=merge" >> "$GITHUB_OUTPUT"
            echo "${TARGET_BRANCH} is simply behind ${SOURCE_BRANCH} — will fast-forward merge"
          fi

      - name: Merge source into target (fast-forward)
        if: >-
          steps.check.outputs.sync_needed == 'true' &&
          steps.diverge.outputs.strategy == 'merge'
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          git checkout "${TARGET_BRANCH}"
          git merge --ff-only "origin/${SOURCE_BRANCH}" \
            --no-edit
          git push origin "${TARGET_BRANCH}"
          echo "✅ Merged ${SOURCE_BRANCH} → ${TARGET_BRANCH}"

      - name: Force-reset target to source (diverged)
        if: >-
          steps.check.outputs.sync_needed == 'true' &&
          steps.diverge.outputs.strategy == 'force-reset'
        env:
          AHEAD: ${{ steps.diverge.outputs.ahead }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse "origin/${TARGET_BRANCH}")
          echo "::warning::Force-resetting ${TARGET_BRANCH} to origin/${SOURCE_BRANCH} — dropping ${AHEAD} diverged commit(s). Verify no human work was on this branch."
          echo "Expected: automated (Renovate digests, prior sync commits)"
          git checkout "${TARGET_BRANCH}"
          git reset --hard "origin/${SOURCE_BRANCH}"
          git push origin "${TARGET_BRANCH}" --force-with-lease="${TARGET_BRANCH}:${TARGET_SHA}"
          echo "✅ Force-reset ${TARGET_BRANCH} → ${SOURCE_BRANCH} (dropped ${AHEAD} diverged commits)"
