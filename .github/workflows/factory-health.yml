name: Factory Health

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: factory-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate common issue token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          owner: projectbluefin
          repositories: common
          permission-issues: write

      - name: Monitor 24h factory success rates
        id: monitor
        env:
          COMMON_ISSUE_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WINDOW_HOURS=24
          THRESHOLD=80
          # Minimum completed runs inside the window before the rate is
          # trusted. A once-a-day pipeline (Nightly E2E) contributes one run
          # to a 24h window, where the only representable rates are 100% and
          # 0% — a single flake reads as a total outage and files a P0
          # (projectbluefin/actions#479, #555). Below the floor: "low-sample".
          MIN_RUNS=3
          # Escalation floor so the sample floor is not a blind spot: an
          # under-sampled pipeline still alerts once this many of its most
          # recent completed runs failed back-to-back.
          MIN_CONSECUTIVE_FAILURES=2
          CUTOFF_EPOCH=$(date -u -d "${WINDOW_HOURS} hours ago" '+%s')
          # Same instant as CUTOFF_EPOCH, in the form `gh run list --created`
          # accepts, so the fetch is bounded by the window the rate is computed
          # over instead of by an arbitrary run count. Both are derived from
          # WINDOW_HOURS so they cannot drift apart.
          CUTOFF_ISO=$(date -u -d "@${CUTOFF_EPOCH}" '+%Y-%m-%dT%H:%M:%SZ')
          RUN_FETCH_LIMIT=200
          INTENDED_ISSUE_REPO="projectbluefin/common"

          # Routing is reported to the job so the "Verify alert routing" step
          # below can fail the run. `continue-on-error` on the app-token step
          # keeps monitoring alive when the token cannot be minted, but it also
          # makes the whole job conclude `success`, so the fallback was silent
          # in the checks UI for months (projectbluefin/actions#556).
          # ISSUE_AUTHOR is the login each token files issues as, in the form
          # `gh issue list --json author` reports it. The dedupe pass only
          # matches alerts this account opened so human-filed issues do not
          # mute the pipeline (projectbluefin/actions#576), and the close pass
          # only acts on alerts this account opened.
          if [[ -n "${COMMON_ISSUE_TOKEN}" ]]; then
            ISSUE_REPO="${INTENDED_ISSUE_REPO}"
            ISSUE_TOKEN="${COMMON_ISSUE_TOKEN}"
            ISSUE_AUTHOR="app/${APP_SLUG}"
            ALERT_ROUTING="intended"
          else
            ISSUE_REPO="${GITHUB_REPOSITORY}"
            ISSUE_TOKEN="${GH_TOKEN}"
            ISSUE_AUTHOR="app/github-actions"
            ALERT_ROUTING="fallback"
            echo "::warning::Could not mint the ${INTENDED_ISSUE_REPO} issue token (app-token step: ${APP_TOKEN_OUTCOME}); factory alerts will be misrouted to ${ISSUE_REPO}. See the app-token step log for the API error."
          fi
          {
            echo "alert_routing=${ALERT_ROUTING}"
            echo "intended_issue_repo=${INTENDED_ISSUE_REPO}"
            echo "fallback_issue_repo=${GITHUB_REPOSITORY}"
          } >> "${GITHUB_OUTPUT}"

          # A misrouted alert lands without the priority/p0, area/ci and
          # kind/bug labels, because those labels only exist in the intended
          # repo. Say so in the body so the issue is self-describing wherever
          # it ends up.
          misroute_banner=''
          if [[ "${ALERT_ROUTING}" == "fallback" ]]; then
            misroute_banner=$(cat <<EOF

          > [!WARNING]
          > **This alert was misrouted.** It belongs in \`${INTENDED_ISSUE_REPO}\`, but the
          > MergeRaptor app token for that repo could not be minted, so it was filed here with
          > the workflow's own repository-scoped token and without the usual alert labels.
          > Tracking: projectbluefin/actions#556.
          EOF
            )
          fi

          monitor_pipeline() {
            local repo="$1"
            local pipeline="$2"
            local workflow="$3"

            local runs_json fetched recent_json completed_json total success rate_display rate_value status failures_md
            local consecutive_failures

            # `--created` filters server-side, so the fetch budget is spent on
            # runs inside the window instead of on history that the cutoff
            # filter below discards anyway. Without it the 24h sample is
            # defended only by low run volume: a busy pipeline's most recent
            # N runs can all predate the window, silently shrinking the
            # measured set — worst case a healthy pipeline reads `no-runs`.
            runs_json=$(gh run list \
              --repo "${repo}" \
              --workflow "${workflow}" \
              --created ">=${CUTOFF_ISO}" \
              --limit "${RUN_FETCH_LIMIT}" \
              --json createdAt,status,conclusion,url \
              2>/dev/null || echo '[]')

            # Saturating the cap means the window may still be truncated.
            # Say so rather than reporting a rate computed from a partial
            # sample as if it were the whole window.
            fetched=$(jq 'length' <<<"${runs_json}")
            if (( fetched >= RUN_FETCH_LIMIT )); then
              echo "::warning::${repo} / ${workflow}: fetched ${fetched} runs, saturating the ${RUN_FETCH_LIMIT}-run cap for the ${WINDOW_HOURS}h window; the measured sample may be truncated. Raise RUN_FETCH_LIMIT in factory-health.yml." >&2
            fi

            # Kept even though --created already bounds the fetch: the server
            # filter is a search qualifier, not a guarantee, and the rate must
            # be computed over exactly the window the alert claims.
            recent_json=$(jq --argjson cutoff "${CUTOFF_EPOCH}" '
              [ .[]
              | select((.createdAt | fromdateiso8601) >= $cutoff)
              ]
            ' <<<"${runs_json}")

            completed_json=$(jq '
              [ .[]
              # Only genuine build outcomes count toward the success rate.
              # Cancelled runs were preempted (not failed) and action_required
              # runs are pending approval — neither produced a build result, so
              # counting them deflates the rate and fires false alerts
              # (projectbluefin/actions#483). skipped/in_progress excluded too.
              | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))
              ]
            ' <<<"${recent_json}")

            total=$(jq 'length' <<<"${completed_json}")
            success=$(jq '[ .[] | select(.conclusion == "success") ] | length' <<<"${completed_json}")

            # Back-to-back failures on the most recent completed runs, read from
            # the whole fetched history rather than the window: a once-a-day
            # pipeline has one run in a 24h window, so the window alone cannot
            # tell a one-off flake from a pipeline failing every night.
            # index("success") is the count of leading failures; null (never
            # succeeded in the fetched history) falls back to the run count.
            consecutive_failures=$(jq '
              [ .[]
              | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))
              ]
              | sort_by(.createdAt)
              | reverse
              | map(.conclusion)
              | (index("success") // length)
            ' <<<"${runs_json}")

            if (( total > 0 )); then
              rate_value=$(( success * 100 / total ))
              rate_display="${rate_value}%"
              if (( rate_value >= THRESHOLD )); then
                status="healthy"
              elif (( total >= MIN_RUNS )); then
                status="alert"
              elif (( consecutive_failures >= MIN_CONSECUTIVE_FAILURES )); then
                # Under-sampled, but failing run after run — a real outage.
                status="alert"
              else
                status="low-sample"
              fi
            else
              rate_value=-1
              rate_display="n/a"
              status="no-runs"
            fi

            failures_md=$(jq -r '
              [
                .[]
                | select(.conclusion != "success")
                | "- [" + .conclusion + "](" + .url + ")"
              ][0:5][]
            ' <<<"${completed_json}" || true)

            jq -n \
              --arg repo "${repo}" \
              --arg pipeline "${pipeline}" \
              --arg workflow "${workflow}" \
              --argjson total "${total}" \
              --argjson success "${success}" \
              --argjson rate_value "${rate_value}" \
              --arg rate_display "${rate_display}" \
              --arg status "${status}" \
              --argjson consecutive_failures "${consecutive_failures}" \
              --argjson min_runs "${MIN_RUNS}" \
              --arg failures_md "${failures_md}" \
              '{
                repo: $repo,
                pipeline: $pipeline,
                workflow: $workflow,
                total: $total,
                success: $success,
                rate_value: $rate_value,
                rate_display: $rate_display,
                status: $status,
                consecutive_failures: $consecutive_failures,
                min_runs: $min_runs,
                failures_md: $failures_md
              }'
          }

          results='[]'
          while IFS='|' read -r repo pipeline workflow; do
            row=$(monitor_pipeline "${repo}" "${pipeline}" "${workflow}")
            results=$(jq --argjson row "${row}" '. + [$row]' <<<"${results}")
          done <<'EOF'
          projectbluefin/bluefin|Build|Testing Images
          projectbluefin/bluefin|E2E|Nightly E2E
          projectbluefin/bluefin|Promote|Promote testing to main
          projectbluefin/bluefin-lts|Build|Build Bluefin LTS
          projectbluefin/bluefin-lts|E2E|Post-Merge E2E — Testing Parity
          projectbluefin/bluefin-lts|Promote|Promote testing to main
          projectbluefin/dakota|Build|Build Bluefin dakota
          projectbluefin/dakota|Promote|Publish Bluefin dakota
          projectbluefin/common|Build|Build
          projectbluefin/common|Unit Tests|Unit Tests
          EOF

          summary_table=$(
            jq -r '
              [
                "| Repo | Pipeline | Workflow | Success | Rate | Status |",
                "|---|---|---|---:|---:|---|"
              ] + (
                map(
                  "| \(.repo) | \(.pipeline) | \(.workflow) | \(.success)/\(.total) | \(.rate_display) | \(.status) |"
                )
              ) | .[]
            ' <<<"${results}"
          )

          echo "Factory health summary (${WINDOW_HOURS}h window)"
          echo "${summary_table}"
          {
            echo "## Factory health summary (${WINDOW_HOURS}h window)"
            echo
            echo "${summary_table}"
          } >> "${GITHUB_STEP_SUMMARY}"

          open_issues_json=$(GH_TOKEN="${ISSUE_TOKEN}" gh issue list \
            --repo "${ISSUE_REPO}" \
            --state open \
            --limit 100 \
            --json number,title,url,author)

          # Close alerts whose pipeline is healthy again. The dedupe check in
          # the breach loop below matches on the issue title prefix, so a stale
          # open alert silently mutes every later breach of that same
          # repo+pipeline. Nothing closed these issues before, and
          # projectbluefin/actions#490 is the proof: dakota Promote recovered to
          # 100% on the rerun and its alert stayed open, muting that pipeline
          # indefinitely. Only alerts opened by ISSUE_AUTHOR are closed: a title
          # prefix alone does not prove this workflow opened the issue. Closing
          # is best-effort — a single issue that cannot be closed must not stop
          # the alerting pass that follows.
          printf '%s' "${results}" > "${RUNNER_TEMP}/factory-health-results.json"
          printf '%s' "${open_issues_json}" > "${RUNNER_TEMP}/factory-health-open-issues.json"

          # Resolving recoveries is itself best-effort: this step runs under
          # `set -euo pipefail`, so an unguarded failure here (missing file,
          # traceback) would abort before the breach loop and take down the
          # pre-existing alerting pass — the opposite of what the note above
          # promises. Fall back to "nothing recovered" and keep going.
          if ! recovered_json=$(python3 scripts/factory_health_resolve.py \
            --results "${RUNNER_TEMP}/factory-health-results.json" \
            --open-issues "${RUNNER_TEMP}/factory-health-open-issues.json" \
            --author "${ISSUE_AUTHOR}"); then
            echo "::warning::Could not resolve recovered alerts; skipping the close pass and continuing to alerting."
            recovered_json='[]'
          fi

          issues_closed=0
          while IFS= read -r recovered; do
            [[ -n "${recovered}" ]] || continue

            number=$(jq -r '.number' <<<"${recovered}")
            repo=$(jq -r '.repo' <<<"${recovered}")
            pipeline=$(jq -r '.pipeline' <<<"${recovered}")
            workflow=$(jq -r '.workflow' <<<"${recovered}")
            rate_display=$(jq -r '.rate_display' <<<"${recovered}")
            success=$(jq -r '.success' <<<"${recovered}")
            total=$(jq -r '.total' <<<"${recovered}")

            recovery_body=$(cat <<EOF
          ## Factory success rate recovered

          \`${workflow}\` (${repo} / ${pipeline}) is back above the ${THRESHOLD}% threshold: **${rate_display}** (${success}/${total}) over the last ${WINDOW_HOURS} hours.

          Closing automatically so this pipeline can alert again — an open alert suppresses new ones for the same repo and pipeline.

          Closed automatically by \`.github/workflows/factory-health.yml\`.
          EOF
            )

            if ! GH_TOKEN="${ISSUE_TOKEN}" gh issue comment "${number}" \
              --repo "${ISSUE_REPO}" \
              --body "${recovery_body}"; then
              echo "::warning::Could not comment on recovered alert ${ISSUE_REPO}#${number}; leaving it open."
              continue
            fi

            if ! GH_TOKEN="${ISSUE_TOKEN}" gh issue close "${number}" \
              --repo "${ISSUE_REPO}" \
              --reason completed; then
              echo "::warning::Could not close recovered alert ${ISSUE_REPO}#${number}."
              continue
            fi

            echo "Closed recovered alert #${number} (${repo} ${pipeline}: ${rate_display})."
            issues_closed=$((issues_closed + 1))
          done < <(jq -c '.[]' <<<"${recovered_json}")

          existing_labels=$(GH_TOKEN="${ISSUE_TOKEN}" gh label list \
            --repo "${ISSUE_REPO}" \
            --limit 200 \
            --json name \
            --jq '.[].name')

          label_args=()
          for label in priority/p0 area/ci kind/bug; do
            if grep -Fxq "${label}" <<<"${existing_labels}"; then
              label_args+=(--label "${label}")
            else
              echo "::warning::Label '${label}' does not exist in ${ISSUE_REPO}; skipping it."
            fi
          done

          issues_opened=0
          while IFS= read -r breach; do
            repo=$(jq -r '.repo' <<<"${breach}")
            pipeline=$(jq -r '.pipeline' <<<"${breach}")
            workflow=$(jq -r '.workflow' <<<"${breach}")
            rate_display=$(jq -r '.rate_display' <<<"${breach}")
            success=$(jq -r '.success' <<<"${breach}")
            total=$(jq -r '.total' <<<"${breach}")
            consecutive_failures=$(jq -r '.consecutive_failures' <<<"${breach}")
            failures_md=$(jq -r '.failures_md' <<<"${breach}")

            title_prefix="fix(factory): [${repo}] [${pipeline}] success rate dropped"
            existing_issue=$(jq -r \
              --arg prefix "${title_prefix}" \
              --arg author "${ISSUE_AUTHOR}" \
              '.[] | select(.title | startswith($prefix)) | select(.author.login == $author) | .number' \
              <<<"${open_issues_json}" | head -1)

            if [[ -n "${existing_issue}" ]]; then
              echo "Open issue already exists for ${repo} ${pipeline}: #${existing_issue}"
              continue
            fi

            if [[ -z "${failures_md}" ]]; then
              failures_md='- No failing completed runs captured in the 24h window.'
            fi

            issue_title="${title_prefix} to ${rate_display} (24h window)"
            issue_body=$(cat <<EOF
          ## Factory success rate alert
          ${misroute_banner}

          Monitoring window: last ${WINDOW_HOURS} hours
          Threshold: ${THRESHOLD}%
          Minimum sample for a rate alert: ${MIN_RUNS} completed runs
          (below that, ${MIN_CONSECUTIVE_FAILURES} back-to-back failures)

          ### Current pipeline rates
          ${summary_table}

          ### Alerting pipeline
          - Repo: ${repo}
          - Pipeline: ${pipeline}
          - Workflow: ${workflow}
          - Success rate: ${rate_display} (${success}/${total})
          - Consecutive failures on the most recent completed runs: ${consecutive_failures}

          ### Failing runs
          ${failures_md}

          Opened automatically by \`.github/workflows/factory-health.yml\`.
          EOF
            )

            GH_TOKEN="${ISSUE_TOKEN}" gh issue create \
              --repo "${ISSUE_REPO}" \
              --title "${issue_title}" \
              --body "${issue_body}" \
              "${label_args[@]}"

            issues_opened=$((issues_opened + 1))
          done < <(jq -c '.[] | select(.status == "alert")' <<<"${results}")

          low_sample=$(jq -r '[ .[] | select(.status == "low-sample") ] | length' <<<"${results}")
          if (( low_sample > 0 )); then
            echo "::notice::${low_sample} pipeline(s) are below the ${MIN_RUNS}-run sample floor; reported as low-sample instead of alert."
          fi

          echo "Opened ${issues_opened} issue(s); closed ${issues_closed} recovered issue(s)."

      # Runs last so the health summary above is always produced, then turns the
      # degraded state into a red check. Without this the job concludes
      # `success` while alerts pile up in the wrong repo, which is exactly how
      # projectbluefin/actions#556 went unnoticed. Remediation is an app
      # installation change, not a workflow change: grant the MergeRaptor App
      # `Issues: write` on projectbluefin/common and approve the new permission
      # on the installation. Until then every run of this workflow is red.
      - name: Verify alert routing
        if: always() && steps.monitor.outputs.alert_routing == 'fallback'
        env:
          INTENDED_ISSUE_REPO: ${{ steps.monitor.outputs.intended_issue_repo }}
          FALLBACK_ISSUE_REPO: ${{ steps.monitor.outputs.fallback_issue_repo }}
        run: |
          set -euo pipefail

          echo "::error title=Factory alerts are misrouted::Factory alerts were filed in ${FALLBACK_ISSUE_REPO} instead of ${INTENDED_ISSUE_REPO}, because the MergeRaptor app token could not be minted."
          {
            echo
            echo "### :rotating_light: Alert routing degraded"
            echo
            echo "Factory alerts were filed in \`${FALLBACK_ISSUE_REPO}\` instead of \`${INTENDED_ISSUE_REPO}\`."
            echo
            echo "The health checks above still ran and are accurate. What failed is only the"
            echo "destination for alerts: the \`Generate common issue token\` step could not mint a"
            echo "token for \`${INTENDED_ISSUE_REPO}\`, so the workflow fell back to its own"
            echo "repository-scoped token."
            echo
            echo "**Fix (maintainer, GitHub App settings — not a workflow change):** grant the"
            echo "MergeRaptor App \`Issues: write\` on \`${INTENDED_ISSUE_REPO}\` and approve the"
            echo "new permission on the installation. Then re-run this workflow; this step passes"
            echo "once a token is minted."
          } >> "${GITHUB_STEP_SUMMARY}"

          exit 1
