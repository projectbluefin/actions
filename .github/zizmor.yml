# zizmor baseline for the `Audit GitHub Actions` check (see #674).
#
# The check runs `zizmor --min-severity=medium --min-confidence=medium .`
# and must start green. Every entry below names a finding that exists on
# main today and says why it is accepted or when it goes away. Remove an
# entry as soon as the site it covers is fixed; never add one to silence a
# finding on new code without a reason next to it.
#
# Regenerate the list of current findings with:
#   zizmor --offline --no-config --min-severity=medium --min-confidence=medium .
#
# (--no-config is required: zizmor auto-discovers this file, so without it
# every baselined finding is suppressed and the command reports nothing.)
#
# Bare filenames ignore a rule for the whole file. Prefer filename:line so
# that a new finding elsewhere in the same file still fails the check.

rules:
  dangerous-triggers:
    ignore:
      # workflow_run guarded by head_repository == github.repository
      - update-v1-tag.yml
      # reusable workflow gates on bot author + exact head SHA
      - renovate-automerge.yml

  template-injection:
    ignore:
      # inputs.* are caller literals in every consumer; held PR #544 touches
      # these lines, so the move into env: waits for that PR
      - reusable-sync-branches.yml
      # inputs.* are caller literals in every consumer (audited 2026-10-21)
      - reusable-pkg-cadence.yml
      # TEMPORARY: github.actor / inputs.* expanded inside run:. Values are
      # not attacker-controlled today. Each site is a mechanical move into
      # env:; drop the entry when that lands.
      - reusable-execute-release.yml:142
      - reusable-execute-release.yml:213
      - reusable-release-gate.yml:114
      - reusable-release.yml:418
      - reusable-vulnerability-scan.yml:80
      - reusable-vulnerability-scan.yml:88
      - reusable-vulnerability-scan.yml:94
      - reusable-vulnerability-scan.yml:137

  excessive-permissions:
    ignore:
      # TEMPORARY: workflow-level packages: write also reaches the echo-only
      # report job. The migration-test job already declares it at job level;
      # drop the entry once the workflow-level block is deleted.
      - migration-test.yml:95

  github-app:
    ignore:
      # App tokens minted with owner: scope and no repositories: list. The
      # callers need cross-repository access to consumer repos by design
      # (factory drift reads consumer workflows; cadence and automerge act on
      # the calling consumer repo).
      - factory-drift.yml:31
      - reusable-pkg-cadence.yml:89
      - reusable-pkg-cadence.yml:93
      - reusable-renovate-automerge.yml:103

  secrets-inherit:
    ignore:
      # Calls a first-party reusable workflow in this repository, which
      # needs the signing/App credentials of the caller; an explicit secret
      # list is a follow-up, not a regression.
      - reusable-promote-squash.yml:521
